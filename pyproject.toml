[project]
name = "SleuthBench"
version = "0.1.0"
description = "Automated QA generation for benchmarking LLMs on tabular data analysis tasks."
# Core validators and shared statistical metrics rely on scipy.stats; 1.17.1 is
# the tested minimum for the supported Python versions.
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic",
    "boto3",
    "openai",
    "scikit-learn",
    "pandas",
    "numpy",
    "pyyaml",
    "python-dotenv",
    "jsonschema",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
notebook = ["matplotlib>=3.9.4", "jupyter"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    "__pycache__",
    ".venv",
    "venv",
    "node_modules",
    "**/site-packages",
    "dist",
    "build",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
